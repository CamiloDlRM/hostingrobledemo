version: '3.8'

services:

  traefik:
    # The latest official supported Traefik docker image
    image: traefik:v2.3
    # Enables the Traefik Dashboard and tells Traefik to listen to docker
    # --providers tell Traefik to connect to the Docker provider
    # enable --log.level=INFO so we can see what Traefik is doing in the log files
    command: --api.insecure=true --providers.docker --log.level=INFO
    ports:
      # Exposes port 80 for incoming web requests
      - "80:80"
      # The Web UI port http://0.0.0.0:8080 (enabled by --api.insecure=true)
      - "8080:8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
  db:
    image: postgres:15-alpine
    container_name: deployment_db
    environment:
      POSTGRES_USER: deployuser
      POSTGRES_PASSWORD: deploypass
      POSTGRES_DB: deployments_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - deployment_network

  backend:
    build: ./backend
    container_name: deployment_backend
    ports:
      - "8000:8000"
    environment:
      # Database
      - DATABASE_URL=postgresql://deployuser:deploypass@db:5432/deployments_db

      # GitHub Organization (NUEVO)
      - GITHUB_ORG_NAME=${GITHUB_ORG_NAME}
      - GITHUB_ORG_TOKEN=${GITHUB_ORG_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}

      # Docker Hub
      - DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME}
      - DOCKER_HUB_PASSWORD=${DOCKER_HUB_PASSWORD}
      - DOCKER_HUB_REPO=${DOCKER_HUB_REPO}

      # Server SSH
      - SERVER_SSH_HOST=${SERVER_SSH_HOST}
      - SERVER_SSH_USER=${SERVER_SSH_USER}
      - SERVER_SSH_KEY_PATH=${SERVER_SSH_KEY_PATH}

      # Domain
      - DOMAIN_BASE=${DOMAIN_BASE}

      # App URLs
      - BACKEND_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:5173

      # Security
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
    volumes:
      - ./backend:/app
    networks:
      - deployment_network

  frontend:
    build:
      context: ./frontend
      args:
        # Pasar como build argument (necesario en build time para Vite)
        VITE_BACKEND_URL: http://localhost:8000
    container_name: deployment_frontend
    ports:
      - "5173:5173"
    environment:
      # También como environment para que esté disponible en dev mode
      - VITE_BACKEND_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - deployment_network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  deployment_network:
    driver: bridge
